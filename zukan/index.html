<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Museに丸投げ図鑑</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b1530">
<style>
:root{--bg:#0b1530;--bg2:#101f45;--acc:#7dc5f2;--txt:#eaf4ff;--dim:#9db4d3;--ph:#ffd479;
--spring:cubic-bezier(.34,1.56,.64,1);--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{background:var(--bg);scroll-behavior:smooth}
body{min-height:100vh;color:var(--txt);background:radial-gradient(120% 60% at 50% -10%,#16295a 0%,var(--bg) 60%);
font-family:system-ui,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;font-weight:800;line-height:1.45;overflow-x:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.orbs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%;will-change:transform;opacity:.55}
.o1{width:360px;height:360px;left:-120px;top:5%;background:radial-gradient(circle,rgba(125,197,242,.38),transparent 68%);animation:d1 19s ease-in-out infinite alternate}
.o2{width:420px;height:420px;right:-160px;top:38%;background:radial-gradient(circle,rgba(183,156,255,.30),transparent 68%);animation:d2 24s ease-in-out infinite alternate}
.o3{width:320px;height:320px;left:10%;bottom:-120px;background:radial-gradient(circle,rgba(111,227,193,.24),transparent 68%);animation:d3 21s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(120px,160px) scale(1.2)}}
@keyframes d2{to{transform:translate(-140px,-120px) scale(.85)}}
@keyframes d3{to{transform:translate(160px,-90px) scale(1.25)}}
main{position:relative;z-index:1}
.wrap{max-width:820px;margin:0 auto;padding:0 16px}
.view.enter>*{animation:rise .6s var(--ease) both}
.view.enter>*:nth-child(2){animation-delay:.06s}.view.enter>*:nth-child(3){animation-delay:.12s}.view.enter>*:nth-child(4){animation-delay:.18s}.view.enter>*:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

/* buttons */
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 22px;border-radius:18px;font-size:18px;font-weight:900;letter-spacing:.02em;
transition:transform .35s var(--spring),box-shadow .3s}
.btn:active{transform:scale(.92)}
.btn.main{color:#06142e;background:linear-gradient(135deg,#a9defa,#6db8ee);box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 8px 30px rgba(125,197,242,.45);animation:pulse 3.2s ease-in-out infinite}
.btn.ghost{background:rgba(125,197,242,.08);border:1.5px solid rgba(125,197,242,.55);box-shadow:0 0 22px rgba(125,197,242,.18)}
@keyframes pulse{50%{box-shadow:0 0 0 1px rgba(255,255,255,.5) inset,0 8px 44px rgba(125,197,242,.8)}}
.pop{animation:pop .5s var(--spring)}
@keyframes pop{0%{transform:scale(.88)}55%{transform:scale(1.07)}100%{transform:scale(1)}}

/* hero */
#hero{min-height:100svh;display:flex;flex-direction:column;padding-top:max(28px,env(safe-area-inset-top))}
#hero .top{padding-top:8px;width:100%}
.badge{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--acc);letter-spacing:.18em}
.badge i{width:8px;height:8px;border-radius:50%;background:var(--acc);box-shadow:0 0 12px var(--acc);animation:blink 2s infinite}
@keyframes blink{50%{opacity:.3}}
h1{margin-top:12px;font-size:clamp(36px,11vw,64px);line-height:1.12;font-weight:900;letter-spacing:-.01em;
background:linear-gradient(100deg,#fff 0%,#9fd6f7 30%,#fff 50%,#7dc5f2 70%,#fff 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 0 24px rgba(125,197,242,.35))}
@keyframes shine{to{background-position:-250% 0}}
.lead{text-wrap:balance;margin-top:12px;font-size:17px;color:var(--dim)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:22px}
.stat{padding:12px 6px 10px;text-align:center;border-radius:16px;background:rgba(125,197,242,.07);border:1px solid rgba(125,197,242,.28);box-shadow:0 0 24px rgba(125,197,242,.1) inset}
.stat b{display:block;font-size:34px;line-height:1.05;font-weight:900;color:#fff;text-shadow:0 0 18px rgba(125,197,242,.8);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--dim)}
.cta{display:grid;gap:10px;margin-top:22px}
.cta2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.sm{min-height:50px;padding:0 10px;font-size:15px;border-radius:16px}
.lastbtn{margin-top:12px;min-height:44px;font-size:14px;color:var(--acc);text-decoration:underline;text-underline-offset:4px}
.marq{overflow:hidden;margin:auto 0;padding:34px 0 34px;display:grid;gap:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.track{display:flex;gap:12px;width:max-content;will-change:transform;animation:slide 70s linear infinite}
.track.rev{animation-direction:reverse;animation-duration:85s}
@keyframes slide{to{transform:translateX(-50%)}}
.mini{flex:none;width:250px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.05);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);box-shadow:0 0 18px color-mix(in srgb,var(--c) 22%,transparent)}
.mini small{display:block;font-size:12px;color:var(--c);letter-spacing:.1em}
.mini b{display:block;font-size:18px;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* top bar */
.bar{display:flex;align-items:center;gap:8px;padding-top:max(14px,env(safe-area-inset-top));min-height:64px}
.back{width:48px;height:48px;border-radius:14px;background:rgba(125,197,242,.1);border:1px solid rgba(125,197,242,.35);font-size:22px;transition:transform .3s var(--spring);flex:none}
.back:active{transform:scale(.88)}
.bar .ttl{font-size:20px;font-weight:900;flex:1}
.bar .cnt{font-size:14px;color:var(--acc)}

/* diag */
.prog{height:8px;border-radius:8px;background:rgba(125,197,242,.15);overflow:hidden;flex:1}
.prog i{display:block;height:100%;width:0;border-radius:8px;background:linear-gradient(90deg,#6db8ee,#b79cff,#ff8fc2);box-shadow:0 0 14px var(--acc);transition:width .6s var(--ease)}
.qwrap{padding-top:clamp(20px,8vh,70px)}
.qn{font-size:14px;color:var(--acc);letter-spacing:.2em}
.q{margin:10px 0 24px;font-size:clamp(26px,7.4vw,40px);line-height:1.3;font-weight:900}
.opts{display:grid;gap:12px}
.opt{min-height:62px;padding:12px 18px;text-align:left;font-size:18px;font-weight:800;border-radius:18px;background:rgba(125,197,242,.08);border:1.5px solid rgba(125,197,242,.35);transition:transform .35s var(--spring),background .2s,border-color .2s,box-shadow .3s}
.opt:active{transform:scale(.94)}
.opt.sel{background:rgba(125,197,242,.3);border-color:#bfe6fb;box-shadow:0 0 28px rgba(125,197,242,.6);animation:pop .45s var(--spring)}
.qbody.in .opt{animation:rise .5s var(--ease) both}
.qbody.in .opt:nth-child(2){animation-delay:.07s}.qbody.in .opt:nth-child(3){animation-delay:.14s}.qbody.in .opt:nth-child(4){animation-delay:.21s}.qbody.in .opt:nth-child(5){animation-delay:.28s}
.qbody.in .q,.qbody.in .qn{animation:rise .45s var(--ease) both}
.qbody.out{opacity:0;transform:translateX(-30px);transition:.22s}

/* result */
.rtop{text-align:center;padding:30px 0 6px}
.rtop small{font-size:14px;color:var(--acc);letter-spacing:.2em}
.rname{margin-top:10px;font-size:clamp(34px,10vw,56px);font-weight:900;line-height:1.15;background:linear-gradient(100deg,#fff,#7dc5f2 50%,#ff8fc2);-webkit-background-clip:text;background-clip:text;color:transparent;animation:bloom 1s var(--ease) both;filter:drop-shadow(0 0 20px rgba(125,197,242,.5))}
@keyframes bloom{from{opacity:0;transform:scale(.7);filter:blur(14px)}to{opacity:1;transform:none}}
.rtext{margin-top:8px;color:var(--dim);font-size:15px;animation:rise .6s .5s var(--ease) both}
.rhead{margin:22px 0 12px;font-size:18px;font-weight:900;display:flex;align-items:center;gap:8px}
.rhead::before{content:"";width:5px;height:20px;border-radius:3px;background:var(--acc);box-shadow:0 0 12px var(--acc)}
.rgo{display:grid;gap:12px;margin:22px 0 40px}
.fly{animation:fly .7s var(--spring) both}
@keyframes fly{from{opacity:0;transform:translateY(60px) scale(.8) rotate(-3deg)}to{opacity:1;transform:none}}

/* zukan */
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:6px 0 14px}
.chip{flex:none;min-height:40px;padding:0 12px;border-radius:20px;font-size:13.5px;font-weight:900;background:rgba(255,255,255,.05);border:1.5px solid color-mix(in srgb,var(--c,var(--acc)) 50%,transparent);transition:transform .35s var(--spring),background .25s,box-shadow .3s}
.chip:active{transform:scale(.9)}
.chip.on{color:#06142e;background:var(--c,var(--acc));box-shadow:0 0 22px color-mix(in srgb,var(--c,var(--acc)) 70%,transparent)}
.tools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 14px}
.sw{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}
.sw i{position:relative;width:52px;height:30px;border-radius:15px;background:rgba(255,255,255,.12);border:1px solid rgba(125,197,242,.4);transition:background .25s,box-shadow .3s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .4s var(--spring)}
.sw[aria-checked=true] i{background:#7dc5f2;box-shadow:0 0 18px rgba(125,197,242,.8)}
.sw[aria-checked=true] i::after{transform:translateX(22px)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding-bottom:50px;transition:opacity .15s}
.grid.out{opacity:0}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-height:156px;padding:14px 13px 12px;text-align:left;border-radius:20px;overflow:hidden;
background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(255,255,255,.03) 60%);
border:1px solid color-mix(in srgb,var(--c) 42%,transparent);box-shadow:0 0 26px color-mix(in srgb,var(--c) 16%,transparent),0 1px 0 rgba(255,255,255,.12) inset;
opacity:0;transform:translateY(26px) scale(.94);transition:opacity .5s var(--ease),transform .5s var(--spring),box-shadow .3s}
.card.in{opacity:1;transform:none}
.card.in:active{transform:scale(.93);transition-duration:.15s}
.card::after{content:"";position:absolute;right:-30px;top:-30px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 40%,transparent),transparent 70%);pointer-events:none}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:6px}
.card .num{font-size:22px;font-weight:900;color:var(--c);text-shadow:0 0 14px var(--c);font-variant-numeric:tabular-nums}
.card .cat{white-space:nowrap;font-size:11px;padding:3px 8px;border-radius:10px;color:#06142e;background:var(--c)}
.card .t{text-wrap:balance;font-size:17px;line-height:1.28;font-weight:900;margin-top:2px}
.card .h{font-size:12.5px;line-height:1.4;color:var(--dim);font-weight:700}
.card .wt{margin-top:auto;padding-top:4px;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
.card .wt i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.18)}
.card .wt i.f{background:var(--c);box-shadow:0 0 8px var(--c)}
.card .wt em{font-style:normal;margin-left:4px}
.card .lv{position:absolute;right:12px;bottom:11px;font-size:10px;color:var(--c);opacity:.9}
.empty{grid-column:1/-1;text-align:center;padding:50px 0;color:var(--dim)}

/* sheet */
.back-d{position:fixed;inset:0;z-index:20;background:rgba(3,8,22,.65);opacity:0;transition:opacity .3s}
.back-d.on{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:600px;margin:0 auto;max-height:92svh;display:flex;flex-direction:column;border-radius:26px 26px 0 0;
background:linear-gradient(180deg,#14275a,#0d1a3c);border:1px solid color-mix(in srgb,var(--c) 55%,transparent);border-bottom:0;box-shadow:0 -10px 60px color-mix(in srgb,var(--c) 28%,transparent);
transform:translateY(105%);transition:transform .5s var(--ease)}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);margin:10px auto 0;flex:none}
.sh{display:flex;align-items:center;gap:10px;padding:8px 10px 8px 16px;flex:none}
.sh .num{font-size:26px;font-weight:900;color:var(--c);text-shadow:0 0 14px var(--c)}
.sh .st{flex:1;font-size:19px;font-weight:900;line-height:1.25}
.x{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.08);font-size:20px;transition:transform .3s var(--spring)}
.x:active{transform:scale(.85)}
.sb{overflow-y:auto;padding:4px 16px calc(28px + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.lab{display:inline-block;font-size:12px;letter-spacing:.12em;padding:3px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);margin:8px 0}
.bubble{position:relative;padding:14px 16px;border-radius:18px 18px 18px 4px;background:rgba(125,197,242,.13);border:1px solid rgba(125,197,242,.4);font-size:16px;line-height:1.75;font-weight:700;white-space:pre-wrap;font-size:14.5px}
.bubble .ph{-webkit-box-decoration-break:clone;box-decoration-break:clone;color:#1a1203;background:var(--ph);padding:1px 6px;border-radius:7px;font-weight:900;box-shadow:0 0 14px rgba(255,212,121,.55);animation:phg 2.4s ease-in-out infinite}
@keyframes phg{50%{box-shadow:0 0 4px rgba(255,212,121,.2)}}
.copy{margin-top:12px;width:100%}
.copy.done{background:linear-gradient(135deg,#b4f2dd,#6fe3c1);box-shadow:0 8px 30px rgba(111,227,193,.5);animation:pop .5s var(--spring)}
.fb{width:100%;margin-top:10px;min-height:90px;padding:10px;border-radius:12px;background:#07102a;color:var(--txt);border:1px solid var(--acc);font:inherit;font-size:14px}
.arrow{display:flex;justify-content:center;padding:14px 0 4px}
.arrow span{font-size:13px;color:var(--c);padding:6px 14px;border-radius:16px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(5px)}}
.row-i{opacity:0;transform:translateY(8px);transition:opacity .35s,transform .45s var(--spring)}
.row-i.on{opacity:1;transform:none}
.u{opacity:0}
.scr{margin-top:8px;border-radius:18px;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.45);border:1px solid rgba(255,255,255,.12)}
.scr .hd{padding:10px 14px;font-size:14px;font-weight:900;display:flex;align-items:center;gap:8px}
/* list */
.k-list{background:#10204a}
.k-list .hd{background:rgba(125,197,242,.14);color:var(--acc)}
.k-list .hd::before{content:"";width:10px;height:10px;border-radius:3px;background:var(--acc)}
.k-list ul{list-style:none;padding:8px 14px 14px}
.k-list li{display:flex;gap:12px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed rgba(255,255,255,.12);font-size:15px;line-height:1.5}
.k-list li:last-child{border:0}
.ck{flex:none;position:relative;width:22px;height:22px;margin-top:1px;border-radius:7px;border:2px solid var(--acc)}
.ck::after{content:"";position:absolute;left:5px;top:1px;width:6px;height:12px;border:solid #06142e;border-width:0 3px 3px 0;transform:rotate(40deg) scale(0);transition:transform .4s var(--spring)}
.on .ck{background:var(--acc);box-shadow:0 0 12px var(--acc)}
.on .ck::after{transform:rotate(40deg) scale(1)}
/* doc */
.k-doc{background:#f6f3ea;color:#25283a;border-color:#fff}
.k-doc .pp{padding:22px 20px 24px;}
.k-doc h4{font-size:19px;margin-bottom:12px;padding-bottom:10px;border-bottom:3px solid #7dc5f2}
.k-doc p{font-size:15px;line-height:34px;font-weight:700;margin:0}
/* table */
.k-table{background:#0f1c40}
.k-table .hd{background:rgba(111,227,193,.16);color:#6fe3c1}
.tb{display:grid;grid-template-columns:minmax(64px,32%) 1fr}
.tb>div{padding:11px 12px;font-size:14.5px;line-height:1.45;border-bottom:1px solid rgba(255,255,255,.1)}
.tb>div:nth-child(odd){background:rgba(255,255,255,.06);color:#6fe3c1;font-weight:900;border-right:1px solid rgba(255,255,255,.1)}
/* chat */
.k-chat{background:#0e1b3d;padding-bottom:14px}
.k-chat .hd{background:rgba(183,156,255,.16);color:#c9b6ff}
.av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#7dc5f2,#b79cff);display:grid;place-items:center;color:#06142e;font-size:13px;font-weight:900;box-shadow:0 0 12px #b79cff}
.cb{display:grid;gap:8px;padding:12px 14px 2px;justify-items:start}
.bb{max-width:92%;padding:10px 14px;border-radius:16px 16px 16px 4px;background:rgba(183,156,255,.18);border:1px solid rgba(183,156,255,.4);font-size:14.5px;line-height:1.55}
/* site */
.k-site{background:#e9eef8;color:#14203f}
.bw{display:flex;align-items:center;gap:6px;padding:9px 12px;background:#cfd8ea}
.bw i{width:10px;height:10px;border-radius:50%;background:#ff8fa3}.bw i:nth-child(2){background:#ffd479}.bw i:nth-child(3){background:#6fe3c1}
.url{flex:1;margin-left:6px;padding:4px 12px;border-radius:12px;background:#fff;font-size:12px;color:#51608a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg{padding:0 0 16px}
.hero-s{padding:22px 16px;background:linear-gradient(135deg,#7dc5f2,#b79cff);color:#06142e}
.hero-s h4{font-size:21px;line-height:1.3}
.hero-s p{font-size:14px;margin-top:6px}
.blk{margin:10px 14px 0;padding:11px 14px;border-radius:12px;background:#fff;border-left:5px solid #7dc5f2;font-size:14px;box-shadow:0 2px 10px rgba(20,32,63,.08)}
.fk{margin:14px 14px 0;display:inline-block;padding:10px 22px;border-radius:20px;background:#14203f;color:#fff;font-size:14px}
/* image */
.k-image{background:#0b1530;padding:14px;border-color:transparent;box-shadow:none}
.fr{padding:10px;border-radius:6px;background:linear-gradient(135deg,#f3dca0,#b88a3e 40%,#f6e4b0 60%,#a97c32);box-shadow:0 14px 40px rgba(0,0,0,.6)}
.art{position:relative;aspect-ratio:4/3;overflow:hidden;background:linear-gradient(160deg,#7dc5f2,#b79cff 60%,#ff8fc2)}
.art b{position:absolute;border-radius:50%}
.art .a1{width:58%;aspect-ratio:1;left:-10%;top:-14%;background:rgba(255,255,255,.35)}
.art .a2{width:70%;aspect-ratio:1;right:-18%;bottom:-30%;background:rgba(11,21,48,.5)}
.art .a3{width:26%;aspect-ratio:1;right:18%;top:14%;background:#ffd479;box-shadow:0 0 30px #ffd479}
.art .cap{position:absolute;left:10px;right:10px;bottom:10px;padding:10px 12px;border-radius:12px;background:rgba(8,16,40,.7);color:#fff;font-size:13.5px;line-height:1.5}
.cap strong{display:block;font-size:14px;color:#ffd479;margin-bottom:2px}
.plate{margin:12px auto 0;width:max-content;max-width:100%;padding:5px 16px;border-radius:5px;background:#e8d8a8;color:#3c2c10;font-size:12px}

/* routes */
.rlead{margin:4px 0 14px;font-size:15px;color:var(--dim);text-wrap:balance}
.rlist{display:grid;gap:12px;padding:8px 0 50px}
.rcard{position:relative;display:block;width:100%;text-align:left;padding:16px 16px 14px;border-radius:22px;overflow:hidden;background:linear-gradient(160deg,rgba(125,197,242,.16),rgba(255,255,255,.03) 65%);border:1px solid rgba(125,197,242,.45);box-shadow:0 0 26px rgba(125,197,242,.14),0 1px 0 rgba(255,255,255,.12) inset;transition:transform .35s var(--spring),box-shadow .3s}
.rcard:active{transform:scale(.95)}
.rcard::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,rgba(125,197,242,.4),transparent 70%);pointer-events:none}
.rcard .rt{display:block;font-size:20px;font-weight:900;line-height:1.3;padding-right:34px;text-wrap:balance}
.rcard .rl{display:block;margin-top:6px;font-size:14px;line-height:1.5;color:var(--dim);font-weight:700}
.rcard .rm{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--acc);flex-wrap:wrap}
.rcard .rm span{padding:3px 10px;border-radius:10px;background:rgba(125,197,242,.14)}
.rcard.fin{border-color:#6fe3c1;box-shadow:0 0 28px rgba(111,227,193,.3)}
.pl{display:block;height:6px;margin-top:12px;border-radius:6px;background:rgba(125,197,242,.16);overflow:hidden}
.pl i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,#6db8ee,#6fe3c1);box-shadow:0 0 12px var(--acc);transition:width .7s var(--ease)}
.rhd{padding:4px 0 14px}
.rhd h2{font-size:clamp(22px,6.4vw,30px);line-height:1.25;font-weight:900;text-wrap:balance}
.rhd p{margin-top:6px;font-size:14px;color:var(--dim)}
.rhd .pc{margin-top:6px;font-size:13px;color:var(--acc)}
.steps{display:grid;padding-bottom:20px}
.step{position:relative;display:grid;grid-template-columns:44px 1fr;column-gap:12px;padding-bottom:18px}
.nd{position:relative;z-index:1;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:900;color:var(--c);background:#0d1a3c;border:2px solid var(--c);box-shadow:0 0 16px color-mix(in srgb,var(--c) 40%,transparent);transition:background .3s,color .3s}
.step.done .nd{background:var(--c);color:#06142e}
.nd.pop{animation:pop .55s var(--spring)}
.rail{position:absolute;left:20px;top:44px;bottom:0;width:4px;border-radius:3px;background:rgba(125,197,242,.18);overflow:hidden}
.rail i{display:block;width:100%;height:100%;border-radius:3px;background:linear-gradient(180deg,var(--c),#fff);box-shadow:0 0 12px var(--c);transform:scaleY(0);transform-origin:top;transition:transform .8s var(--ease)}
.step.done .rail i{transform:scaleY(1)}
.sbtn{display:block;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:18px;background:linear-gradient(160deg,color-mix(in srgb,var(--c) 14%,transparent),rgba(255,255,255,.03) 60%);border:1px solid color-mix(in srgb,var(--c) 42%,transparent);transition:transform .35s var(--spring),box-shadow .5s,border-color .5s}
.sbtn:active{transform:scale(.95)}
.sbtn .sc{display:inline-block;font-size:11px;padding:2px 8px;border-radius:9px;color:#06142e;background:var(--c)}
.sbtn .st2{display:block;margin-top:5px;font-size:17px;line-height:1.3;font-weight:900}
.sbtn .sd{display:block;margin-top:5px;font-size:14px;line-height:1.5;color:var(--txt);font-weight:700}
.step.done .sbtn{opacity:.72}
.step.next .sbtn{border-color:var(--c);box-shadow:0 0 28px color-mix(in srgb,var(--c) 55%,transparent);animation:nx 2.2s ease-in-out infinite}
.step.next .nd{box-shadow:0 0 24px var(--c)}
@keyframes nx{50%{box-shadow:0 0 12px color-mix(in srgb,var(--c) 25%,transparent)}}
.pass{display:inline-block;margin-top:10px;max-width:100%;font-size:12.5px;line-height:1.45;font-weight:700;color:var(--c);padding:5px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--c) 50%,transparent);background:rgba(255,255,255,.04)}
.stepcol{min-width:0;padding-bottom:2px}
.fin2{position:relative;margin:6px 0 20px;padding:22px 16px;text-align:center;border-radius:22px;overflow:hidden;background:rgba(111,227,193,.1);border:1px solid #6fe3c1;box-shadow:0 0 30px rgba(111,227,193,.35)}
.fin2 b{position:relative;display:block;font-size:24px;font-weight:900;color:#b4f2dd}
.fin2 span{position:relative;display:block;margin-top:4px;font-size:14px;color:var(--dim)}
.fin2.glow::before{content:"";position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px;border-radius:50%;background:radial-gradient(circle,rgba(111,227,193,.7),transparent 70%);animation:burst 1.4s var(--ease) both}
@keyframes burst{to{transform:scale(9);opacity:0}}
.rbtn{width:100%;margin:0 0 40px;min-height:48px;font-size:15px}
.dn{width:100%;margin-top:16px}
.dn.undo{background:rgba(255,255,255,.06)}
.via{margin-top:14px;display:grid;gap:8px}
.via .btn{min-height:48px;font-size:15px;text-align:center;padding:6px 16px}
footer{position:relative;z-index:1;padding:26px 16px calc(34px + env(safe-area-inset-bottom));text-align:center;font-size:13px;color:var(--dim)}
@media (min-width:700px){.sheet{border-radius:26px;bottom:4vh;border-bottom:1px solid color-mix(in srgb,var(--c) 55%,transparent)}.cta{max-width:560px}.grid{gap:16px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card{opacity:1;transform:none}.row-i{opacity:1;transform:none}html{scroll-behavior:auto}}
.guide{margin:6px 0 50px;padding:20px 16px 18px;border-radius:22px;text-align:center;background:linear-gradient(160deg,rgba(125,197,242,.16),rgba(255,255,255,.03));border:1px solid rgba(125,197,242,.4);box-shadow:0 0 30px rgba(125,197,242,.14)}
.guide .gt{font-size:19px;font-weight:900}.guide .gl{margin:6px 0 14px;font-size:13.5px;color:var(--dim);font-weight:700}.guide .btn{width:100%}
#zukan .grid{padding-bottom:26px}
footer{padding-top:8px}
footer .ft{max-width:520px;margin:0 auto;padding:22px 16px 0;font-size:17px;font-weight:900;color:var(--txt);line-height:1.5;text-wrap:balance}
footer .oc{display:flex;max-width:520px;margin:14px auto 0;text-decoration:none;min-height:60px;font-size:19px}
.glist{display:grid;gap:10px}.glist.two{grid-template-columns:1fr 1fr}
.gr{display:flex;flex-direction:column;gap:4px;justify-content:center;min-height:64px;padding:12px 12px;border-radius:16px;text-align:left;background:rgba(125,197,242,.1);border:1.5px solid rgba(125,197,242,.5);box-shadow:0 0 18px rgba(125,197,242,.16);transition:transform .35s var(--spring)}
.gr:active{transform:scale(.94)}.gr b{font-size:15.5px;line-height:1.3;font-weight:900}.gr small{font-size:12px;color:var(--acc)}
.tip{margin:12px 2px 4px;font-size:12.5px;line-height:1.6;color:var(--dim);font-weight:700}
.bubble .ph{white-space:normal}
</style>

"use strict";

const io="IntersectionObserver" in window?new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);}});},{threshold:.08}):null;

/* ---------- card ---------- */
function makeCard(c,i){
  const b=el("button","card");
  b.style.setProperty("--c",COL[c.cat]||"#7dc5f2");
  b.style.transitionDelay=((i%2)*70)+"ms";
  const r=el("span","row");r.append(el("span","num",pad(c._n)),el("span","cat",SHORT[c.cat]||c.cat));
  const w=el("span","wt");const lv=c.weight==="重め"?3:c.weight==="ふつう"?2:1;
  for(let k=1;k<=3;k++){w.append(el("i",k<=lv?"f":""));}
  w.append(el("em","",c.weight));
  b.append(r,el("span","t",c.title),el("span","h",c.hook),w);
  if(c.level==="慣れたら")b.append(el("span","lv","慣れたら"));
  b.addEventListener("click",()=>openCard(c));
  return b;
}

}

  const catOf={};CARDS.forEach(c=>catOf[c.id]=c.cat);
  if(state.cat==="すべて"){rs=ROUTES.slice();$("#gT").textContent="どれからやるか迷ったら";$("#gL").textContent="やりたい事を選ぶと、手順が出ます。";}
  else{rs=ROUTES.map(r=>({r,n:r.steps.filter(x=>x.c&&x.c.cat===state.cat).length})).filter(x=>x.n>0).sort((a,b)=>b.n-a.n).slice(0,2).map(x=>x.r);$("#gT").textContent="「"+state.cat+"」で迷ったら";$("#gL").textContent="この手順でやってみてね。";}
  g.hidden=!rs.length;box.classList.toggle("two",rs.length>2);
  rs.forEach(r=>{const b=el("button","gr");b.append(el("b","",r.title),el("small","",r.steps.length+"ステップ　→"));b.onclick=()=>{fromZ=true;openRoute(r);};box.append(b);});}

/* ---------- diag ---------- */
let qi=0,score={},busy=false;
function startDiag(){qi=0;score={};busy=false;show("diag");renderQ();}
function renderQ(){
  const q=DIAG.questions[qi],b=$("#qbody");
  $("#prog").style.width=((qi)/DIAG.questions.length*100)+"%";
  b.replaceChildren(el("div","qn",(qi+1)+" / "+DIAG.questions.length),el("div","q",q.q));
  const o=el("div","opts");
  q.options.forEach(op=>{
    const bt=el("button","opt",op.label);
    bt.onclick=()=>{
      if(busy)return;busy=true;bt.classList.add("sel");
      (op.tags||[]).forEach(t=>score[t]=(score[t]||0)+1);
      $("#prog").style.width=((qi+1)/DIAG.questions.length*100)+"%";
      setTimeout(()=>{
        if(qi+1>=DIAG.questions.length){busy=false;finish();return;}
        b.classList.add("out");
        setTimeout(()=>{qi++;b.classList.remove("out");busy=false;renderQ();},RM?0:220);
      },RM?0:420);
    };
    o.append(bt);
  });
  b.append(o);
  b.classList.remove("in");void b.offsetWidth;b.classList.add("in");
}
function pickFor(sc){
  return CARDS.map(c=>({c,s:(c.tags||[]).reduce((a,t)=>a+(sc[t]||0),0)+(c.level==="はじめて"?.5:0)}))
    .sort((a,b)=>b.s-a.s||a.c._n-b.c._n).slice(0,10).map(x=>x.c);
}
function topType(sc){let best=TAGS[0],m=-1;TAGS.forEach(t=>{if((sc[t]||0)>m){m=sc[t]||0;best=t;}});return best;}
function finish(){const t=topType(score);try{localStorage.setItem("mdz_type",JSON.stringify({t,sc:score}));}catch(e){}showResult(t,score);}
function showResult(t,sc){
  show("result");
  const r=DIAG.results[t]||{name:"",text:""};
  const n=$("#rName");n.textContent=r.name;n.style.animation="none";void n.offsetWidth;n.style.animation="";
  $("#rText").textContent=r.text;
  fill($("#rGrid"),pickFor(sc),!RM);
  if(RM)$("#rGrid").querySelectorAll(".card").forEach(c=>c.classList.add("in"));
}
try{const s=JSON.parse(localStorage.getItem("mdz_type")||"null");if(s&&s.t&&DIAG.results[s.t]){$("#bLast").hidden=false;$("#bLast").onclick=()=>showResult(s.t,s.sc||{});}}catch(e){}

/* ---------- zukan ---------- */
const state={cat:"すべて",easy:false};
(function(){
  const box=$("#chips");
  ["すべて"].concat(CATS).forEach(n=>{
    const b=el("button","chip",n);if(COL[n])b.style.setProperty("--c",COL[n]);
    b.onclick=()=>{state.cat=n;box.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===b));swap();};
    if(n===state.cat)b.classList.add("on");box.append(b);
  });
  $("#sw").onclick=e=>{const s=e.currentTarget;state.easy=!state.easy;s.setAttribute("aria-checked",state.easy);swap();};
})();
function list(){return CARDS.filter(c=>(state.cat==="すべて"||c.cat===state.cat)&&(!state.easy||c.level==="はじめて"));}
function renderZ(){
  $("#chips").querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x.textContent===state.cat));
  $("#sw").setAttribute("aria-checked",state.easy);
  const l=list();$("#zCnt").textContent=l.length+"枚";fill($("#zGrid"),l,false);renderGuide();
}
function swap(){const g=$("#zGrid");if(RM){renderZ();return;}g.classList.add("out");setTimeout(()=>{renderZ();g.classList.remove("out");},150);}

/* ---------- routes ---------- */
$("#rtTitle").textContent=U.routeTitle||"つなげ方";
if(U.routeLead){$("#rtLead").textContent=U.routeLead;$("#rtLead").hidden=false;}
function metaLine(r){return [r.time?"目安 "+r.time:"",r.steps.length+"ステップ"].filter(Boolean);}
function renderRoutes(){
  const box=$("#rtList");box.replaceChildren();
  ROUTES.forEach(r=>{
    const b=el("button","rcard");
    const n=doneN(r),tot=r.steps.length;
    if(n===tot)b.classList.add("fin");
    b.append(el("span","rt",r.title));
    if(r.lead)b.append(el("span","rl",r.lead));
    const m=el("span","rm");metaLine(r).forEach(x=>m.append(el("span","",x)));
    m.append(el("span","",n===tot?"ぜんぶ済み":n+" / "+tot+" 済み"));b.append(m);
    const pl=el("span","pl"),i=el("i");i.style.width=(n/tot*100)+"%";pl.append(i);b.append(pl);
    b.onclick=()=>openRoute(r);box.append(b);
  });
}
let curR=null;
function openRoute(r){curR=r;show("route");renderRoute();}
function nextIdx(r){const d=doneSet(r);return r.steps.findIndex(s=>d.indexOf(s.c.id)<0);}
function renderRoute(){
  const r=curR,hd=$("#rdHead");
  hd.replaceChildren(el("h2","",r.title));
  if(r.lead)hd.append(el("p","",r.lead));
  const pl=el("div","pl"),pi=el("i");pl.append(pi);hd.append(pl,el("div","pc",""));
  const box=$("#rdSteps");box.replaceChildren();
  r.steps.forEach((s,i)=>{
    const st=el("div","step");st.style.setProperty("--c",COL[s.c.cat]||"#7dc5f2");
    st.append(el("div","nd",String(i+1)));
    if(i<r.steps.length-1){const rl=el("div","rail");rl.append(el("i"));st.append(rl);}
    const col=el("div","stepcol");
    const b=el("button","sbtn");
    b.append(el("span","sc",s.c.cat),el("span","st2",pad(s.c._n)+"　"+s.c.title));
    if(s.do)b.append(el("span","sd",s.do));
    b.onclick=()=>openCard(s.c,{r,i});
    col.append(b);
    if(s.pass&&i<r.steps.length-1)col.append(el("span","pass","↓ "+s.pass));
    st.append(col);box.append(st);
  });
  syncRoute(-1,false);
}
function syncRoute(anim,fin){
  const r=curR,d=doneSet(r),steps=$("#rdSteps").children,nx=nextIdx(r),n=doneN(r),tot=r.steps.length;
  r.steps.forEach((s,i)=>{
    const st=steps[i],dn=d.indexOf(s.c.id)>=0,nd=st.querySelector(".nd");
    st.classList.toggle("done",dn);st.classList.toggle("next",i===nx);
    nd.textContent=dn?"✓":String(i+1);
    if(i===anim){nd.classList.remove("pop");void nd.offsetWidth;nd.classList.add("pop");}
  });
  $("#rdHead .pl i").style.width=(n/tot*100)+"%";
  $("#rdHead .pc").textContent=n+" / "+tot+" 済み";
  const ft=$("#rdFoot");ft.replaceChildren();
  if(n===tot){
    const f=el("div","fin2"+(fin&&!RM?" glow":""));f.append(el("b","","おつかれさま"),el("span","","この道すじは、ぜんぶ済みました"));ft.append(f);
  }
  if(n>0){const rb=el("button","btn ghost rbtn","やり直す");rb.onclick=()=>{delete DONE[r.id];saveDone();syncRoute(-1,false);};ft.append(rb);}
  if(fin&&nx>=0&&steps[nx]&&!RM)steps[nx].scrollIntoView({block:"center",behavior:"smooth"});
}
function markStep(r,card,on){
  const d=doneSet(r).slice();const k=d.indexOf(card.id);
  if(on&&k<0)d.push(card.id);if(!on&&k>=0)d.splice(k,1);
  DONE[r.id]=d;saveDone();
  if(curR===r&&!views.route.hidden){
    const i=r.steps.findIndex(s=>s.c.id===card.id);
    setTimeout(()=>syncRoute(on?i:-1,on&&doneN(r)===r.steps.length),RM?0:380);
  }
}

/* ---------- sheet ---------- */
let TK=0,lastFocus=null;
const sheet=$("#sheet"),bd=$("#bd");
function closeSheet(){
  TK++;sheet.classList.remove("on");bd.classList.remove("on");document.body.style.overflow="";
  setTimeout(()=>{sheet.hidden=true;bd.hidden=true;},RM?0:500);
  if(lastFocus&&lastFocus.focus)lastFocus.focus({preventScroll:true});
}
$("#sX").onclick=closeSheet;bd.onclick=closeSheet;
addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet();});

function typed(parent,text,tag){
  const w=tag?el(tag):document.createDocumentFragment();
  const t=el("span","t",""),u=el("span","u",text);
  w.append(t,u);
  if(parent)parent.append(w);
  return {t,u,full:text,node:w};
}
function splitKV(s){const m=s.match(/^(.{1,14}?)[：:｜|→]\s*(.+)$/);return m?[m[1],m[2]]:null;}
const RENDER={
  list(r,items){
    const s=el("div","scr k-list");s.append(el("div","hd",r.title));const ul=el("ul");
    r.lines.forEach(l=>{const li=el("li","row-i");li.append(el("span","ck"));const t=typed(li,l,"span");ul.append(li);items.push({row:li,...t});});
    s.append(ul);return s;
  },
  doc(r,items){
    const s=el("div","scr k-doc"),p=el("div","pp");p.append(el("h4","",r.title));
    r.lines.forEach(l=>{const q=el("p","row-i");const t=typed(q,l);p.append(q);items.push({row:q,...t});});
    s.append(p);return s;
  },
  table(r,items){
    const s=el("div","scr k-table");s.append(el("div","hd",r.title));const g=el("div","tb");
    r.lines.forEach((l,i)=>{
      const kv=splitKV(l)||[String(i+1),l];
      kv.forEach(x=>{const d=el("div","row-i");const t=typed(d,x);g.append(d);items.push({row:d,...t});});
    });
    s.append(g);return s;
  },
  chat(r,items){
    const s=el("div","scr k-chat"),h=el("div","hd");h.append(el("span","av","M"),el("span","",r.title));s.append(h);
    const c=el("div","cb");
    r.lines.forEach(l=>{const b=el("div","bb row-i");const t=typed(b,l);c.append(b);items.push({row:b,...t});});
    s.append(c);return s;
  },
  site(r,items){
    const s=el("div","scr k-site"),bw=el("div","bw");bw.append(el("i"),el("i"),el("i"),el("span","url",r.title));s.append(bw);
    const pg=el("div","pg"),hs=el("div","hero-s");
    const L=r.lines;
    const h=el("h4","row-i"),t0=typed(h,L[0]||"");hs.append(h);items.push({row:h,...t0});
    if(L.length>1){const p=el("p","row-i"),t1=typed(p,L[1]);hs.append(p);items.push({row:p,...t1});}
    pg.append(hs);
    L.slice(2).forEach(l=>{const b=el("div","blk row-i");const t=typed(b,l);pg.append(b);items.push({row:b,...t});});
    pg.append(el("span","fk","▶"));
    s.append(pg);return s;
  },
  image(r,items){
    const s=el("div","scr k-image"),f=el("div","fr"),a=el("div","art");
    a.append(el("b","a1"),el("b","a2"),el("b","a3"));
    const cap=el("div","cap");
    r.lines.forEach(l=>{const d=el("div","row-i");const t=typed(d,l);cap.append(d);items.push({row:d,...t});});
    a.append(cap);f.append(a);s.append(f,el("div","plate",r.title));return s;
  }
};
function play(items,tk){
  if(RM){items.forEach(it=>{it.row.classList.add("on");it.t.textContent=it.full;it.u.textContent="";});return;}
  let i=0;
  const next=()=>{
    if(tk!==TK||i>=items.length)return;
    const it=items[i++];it.row.classList.add("on");
    const st=performance.now();
    const f=now=>{
      if(tk!==TK)return;
      const n=Math.min(it.full.length,Math.floor((now-st)/1000*55)+1);
      it.t.textContent=it.full.slice(0,n);it.u.textContent=it.full.slice(n);
      if(n<it.full.length)requestAnimationFrame(f);else setTimeout(next,140);
    };
    requestAnimationFrame(f);
  };
  setTimeout(next,450);
}
function openCard(c,ctx){
  lastFocus=document.activeElement;
  const tk=++TK;
  sheet.style.setProperty("--c",COL[c.cat]);
  $("#sNum").textContent=pad(c._n);$("#sTitle").textContent=c.title;
  const body=$("#sBody");body.replaceChildren();body.scrollTop=0;
  body.append(el("span","lab","頼み方"));
  const bub=el("div","bubble");
  c.ask.split(/(［[^］]*］)/).forEach(p=>{if(!p)return;bub.append(/^［/.test(p)?el("span","ph",p):document.createTextNode(p));});
  body.append(bub);
  const cp=el("button","btn main copy","コピー");cp.style.animation="none";
  const fb=el("textarea","fb");fb.readOnly=true;fb.hidden=true;fb.value=c.ask;
  cp.onclick=async()=>{
    let ok=false;
    try{await navigator.clipboard.writeText(c.ask);ok=true;}catch(e){}
    if(!ok){fb.hidden=false;fb.focus();fb.select();}
    else{cp.textContent=U.copyDone;cp.classList.remove("done");void cp.offsetWidth;cp.classList.add("done");setTimeout(()=>{cp.textContent="コピー";cp.classList.remove("done");},1800);}
  };
  body.append(cp,fb);
  const tip=el("p","tip",U.pasteTip||"コピーして、Museに貼るだけ。［　］の所は自分の話に変えてください。");body.append(tip);
  const items=[];
  if(ctx){
    const isD=doneSet(ctx.r).indexOf(c.id)>=0;
    const dn=el("button","btn main dn"+(isD?" undo":""),isD?"済みを取り消す":"このステップを済みにする");
    if(isD)dn.style.animation="none";
    dn.onclick=()=>{closeSheet();markStep(ctx.r,c,!isD);};
    body.append(dn);
  }else if(CROUTES[c.id]){
    const v=el("div","via");
    CROUTES[c.id].forEach(r=>{const b=el("button","btn ghost","この順で使う："+r.title);b.onclick=()=>{closeSheet();openRoute(r);};v.append(b);});
    body.append(v);
  }
  bd.hidden=false;sheet.hidden=false;void sheet.offsetWidth;
  bd.classList.add("on");sheet.classList.add("on");document.body.style.overflow="hidden";
  play(items,tk);
  $("#sX").focus({preventScroll:true});
}
show("hero");
</script>
</body>
</html>
